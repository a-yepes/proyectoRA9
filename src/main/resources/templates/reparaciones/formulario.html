<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario reparación</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <h1>Taller mecánico</h1>
    <nav>
        <a th:href="@{/web/clientes}">Clientes</a>
        <a th:href="@{/web/reparaciones}">Reparaciones</a>
    </nav>
</header>
<main>
    <h2 th:text="${reparacion.id == null ? 'Nueva reparación' : 'Editar reparación'}"></h2>
    <form class="formulario" method="post" th:object="${reparacion}"
          th:action="${reparacion.id == null} ? @{/web/reparaciones/nueva} : @{/web/reparaciones/editar/{id}(id=${reparacion.id})}">
        <label>Cliente
            <select name="clienteId" required>
                <option value="">Selecciona cliente</option>
                <option th:each="cliente : ${clientes}"
                        th:value="${cliente.id}"
                        th:selected="${reparacion.cliente != null and reparacion.cliente.id == cliente.id}"
                        th:text="${cliente.nombre + ' - ' + cliente.matricula}"></option>
            </select>
        </label>
        <label>Descripción
            <textarea th:field="*{descripcion}" rows="4" required></textarea>
        </label>
        <label>Fecha de entrada
            <input type="date" th:field="*{fechaEntrada}" required>
        </label>
        <label>Fecha de salida
            <input type="date" th:field="*{fechaSalida}">
        </label>
        <label>Coste euros
            <input type="number" step="0.01" min="0" th:field="*{costeEuros}">
        </label>
        <label>Estado
            <select th:field="*{estado}" required>
                <option value="pendiente">pendiente</option>
                <option value="en curso">en curso</option>
                <option value="finalizado">finalizado</option>
            </select>
        </label>
        <div class="acciones-form">
            <button type="submit">Guardar</button>
            <a th:href="@{/web/reparaciones}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
