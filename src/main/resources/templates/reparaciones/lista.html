<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reparaciones - Taller mecánico AYC</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body>
<header>
    <h1>Taller mecánico</h1>
    <nav>
        <a th:href="@{/web/clientes}">Clientes</a>
        <a th:href="@{/web/reparaciones}">Reparaciones</a>
    </nav>
</header>
<main>
    <div class="barra">
        <h2>Reparaciones</h2>
        <a class="boton" th:href="@{/web/reparaciones/nueva}">Nueva reparación</a>
    </div>

    <form class="filtros" method="get" th:action="@{/web/reparaciones}">
        <input type="text" name="estado" placeholder="Estado: pendiente, en curso..." th:value="${estado}">
        <select name="clienteId">
            <option value="">Todos los clientes</option>
            <option th:each="cliente : ${clientes}"
                    th:value="${cliente.id}"
                    th:selected="${cliente.id == clienteId}"
                    th:text="${cliente.nombre + ' - ' + cliente.matricula}"></option>
        </select>
        <input type="date" name="desde" th:value="${desde}">
        <input type="date" name="hasta" th:value="${hasta}">
        <button type="submit">Filtrar</button>
        <a th:href="@{/web/reparaciones}">Limpiar</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Descripción</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Coste</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="reparacion : ${reparaciones}">
            <td th:text="${reparacion.id}"></td>
            <td th:text="${reparacion.cliente.nombre}"></td>
            <td th:text="${reparacion.descripcion}"></td>
            <td th:text="${reparacion.fechaEntrada}"></td>
            <td th:text="${reparacion.fechaSalida ?: '-'}"></td>
            <td th:text="${#numbers.formatDecimal(reparacion.costeEuros, 1, 2)} + ' €'"></td>
            <td th:text="${reparacion.estado}"></td>
            <td class="acciones">
                <a th:href="@{/web/reparaciones/{id}(id=${reparacion.id})}">Detalle</a>
                <a th:href="@{/web/reparaciones/editar/{id}(id=${reparacion.id})}">Editar</a>
                <form method="post" th:action="@{/web/reparaciones/borrar/{id}(id=${reparacion.id})}">
                    <button type="submit" onclick="return confirm('¿Borrar reparación?')">Borrar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(reparaciones)}">
            <td colspan="8">No hay reparaciones.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
